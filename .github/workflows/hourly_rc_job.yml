name: RC-Network Óránkénti Hirdetésfigyelő

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-rc-scraper:
    runs-on: ubuntu-latest
    steps:
      - name: Kód letöltése
        uses: actions/checkout@v3

      - name: Python környezet beállítása
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Szükséges könyvtárak telepítése
        run: |
          pip install requests beautifulsoup4

      - name: Hirdetésfigyelő futtatása
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
        run: python rc_scraper.py

      - name: Látott URL-ek mentése a tárolóba
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add seen_urls.txt || true
          git commit -m "Update seen_urls.txt [skip ci]" || true
          git push || true
