name: Napi Automatikus Hírgyűjtő

on:
  schedule:
    # UTC 02:18 = Magyar idő szerint 04:18 (CEST)
    - cron: '18 2 * * *'
  workflow_dispatch:

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - name: Kód letöltése
        uses: actions/checkout@v4

      - name: Python környezet beállítása
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Szükséges könyvtárak telepítése
        run: |
          python -m pip install --upgrade pip
          pip install feedparser requests yfinance openai

      - name: Python szkript futtatása
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scraper.py
