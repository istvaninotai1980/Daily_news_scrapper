name: Napi Automatikus Hírgyűjtő

on:
  schedule:
    # CRON időzítés: Minden nap UTC szerint 06:00-kor (Magyar idő szerint kb. 07:00 vagy 08:00)
    - cron: '0 6 * * *'
  # Lehetővé teszi, hogy kézzel is elindíthasd tesztelésképpen a GitHub felületéről
  workflow_dispatch:

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - name: Kód letöltése
        uses: actions/checkout@v3

      - name: Python környezet beállítása
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Szükséges könyvtárak telepítése
        run: |
          python -m pip install --upgrade pip
          pip install feedparser

      - name: Python szkript futtatása
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
        run: python scraper.py
