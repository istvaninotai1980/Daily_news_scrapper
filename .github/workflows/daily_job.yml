name: Napi Automatikus Hírgyűjtő

on:
  schedule:
    # 04:55 CET / CEST időpontra időzítve (UTC 02:55 / 03:55)
    - cron: '55 3 * * *'
  workflow_dispatch:

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - name: Kód letöltése
        uses: actions/checkout@v4

      - name: Python környezet beállítása
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Szükséges könyvtárak telepítése
        run: |
          python -m pip install --upgrade pip
          pip install feedparser requests yfinance

      - name: Python szkript futtatása
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
        run: python scraper.py
