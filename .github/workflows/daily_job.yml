name: Napi Automatikus Hírgyűjtő

on:
  schedule:
    # Magyar idő szerint kb. hajnali 04:35 - 04:45 között fusson le (UTC 02:35)
    # A 35. percben nincs várakozási sor a GitHub szerverein.
    - cron: '35 2 * * *'
  workflow_dispatch:

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - name: Kód letöltése
        uses: actions/checkout@v4

      - name: Python környezet beállítása
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Szükséges könyvtárak telepítése
        run: |
          python -m pip install --upgrade pip
          pip install feedparser requests yfinance

      - name: Python szkript futtatása
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
        run: python scraper.py
